services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DB_HOST: db  # override, karena di dalam docker network, bukan localhost
      MCP_SERVER_URL: http://localhost:8000/mcp
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    command: python run_bot.py
    env_file:
      - .env
    environment:
      DB_HOST: db
      MCP_SERVER_URL: http://api:8000/mcp  # <- PENTING, beda dari yang di service `api`
    depends_on:
      - api

volumes:
  postgres_data: